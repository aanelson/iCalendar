name: Fuzz

# The seed corpora already run with every `go test`; this explores beyond
# them. It runs on a schedule rather than per change so that a new finding
# doesn't fail an unrelated pull request.
on:
  schedule:
    - cron: '23 7 * * 1' # Mondays
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (a Go duration)
        default: 10m

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: .
            target: FuzzDecode
          - dir: contentline
            target: FuzzReader
          - dir: recur
            target: FuzzRule
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
        run: go test ./${{ matrix.dir }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$FUZZTIME"
      - name: Upload failing input
        # Copy it into the same directory locally to make it a regression test.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}
